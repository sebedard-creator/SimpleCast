plugins { id 'com.android.application' }

android {
    namespace 'ca.sebed.simplecast'
    compileSdk 36
    defaultConfig {
        // Keep the installed Android identity so renamed builds update the existing app.
        applicationId 'ca.sebed.castsimple'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '0.4.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Personal sideload build. Keep the same local key for future updates.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            // Desktop Java restricts Origin by default; Android's HTTP client allows it.
            jvmArgs '-Dsun.net.http.allowRestrictedHeaders=true'
        }
    }
}

dependencies {
    implementation project(':protocol')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.nanohttpd:nanohttpd:2.3.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
