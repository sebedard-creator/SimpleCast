<!doctype html>
<html lang="fr">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#102225;color:#ebf5f1;font:17px system-ui;line-height:1.6;margin:0;padding:40px 24px}

p{color:#b5c9c3;margin:12px 0}strong{color:#ebf5f1}ol{list-style:none;padding:0;counter-reset:steps}

small{display:block;color:#8ca9a2;font-size:14px;border-top:1px solid #34504b;margin-top:32px;padding-top:20px}

<h1>Ta vidéo.<br>Sur ta télé.</h1>
<ol><li>Ouvre ton site de streaming.</li><li>Lance la vidéo dans la page.</li><li><strong>Appuie sur Envoyer à la télé.</strong></li></ol>
<small>La première fois, associe ta télé avec le bouton en haut. Ouvre SimpleCast TV sur la télé et utilise le même Wi-Fi.</small>
